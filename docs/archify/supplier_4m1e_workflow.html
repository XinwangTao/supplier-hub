<!DOCTYPE html>

<title>Archify 图 · 供应商五维档案(人机料法环)录入与展示</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f4f6f4; margin: 0; padding: 24px; color: #1b3b32; }

  .meta { color: #5a7268; font-size: 13px; margin-bottom: 20px; }
  .meta a { color: #0e6253; }
  svg { background: #ffffff; border: 1px solid #d7e2dc; border-radius: 10px; display: block; }
  .node rect { rx: 10; fill: #ffffff; stroke: #0e6253; stroke-width: 1.4; }
  .node.manual rect { fill: #eef6f2; }

  .node text.name { font-size: 14px; font-weight: bold; fill: #12332b; }

<body>

<div class="meta">

<svg width="1180" height="560" viewBox="0 0 1180 560">
  <defs>

      <path d="M0,0 L9,4.5 L0,9 z" fill="#7fa79a"/>

  <!-- n1 -->
  <g class="node manual">

  <!-- n2 -->
  <g class="node">
    <rect x="300" y="60" width="210" height="70" rx="10"/>

  <g class="node">
    <rect x="840" y="250" width="200" height="70" rx="10"/>

    <rect x="440" y="250" width="230" height="70" rx="10"/>

<div class="legend">

  范围外:自动评分(QCDST 不动)/企查查自动抓取/权限体系/多租户隔离/CSV 批量导入
