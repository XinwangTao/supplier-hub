<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Archify 图 · 美团式匹配评分排行(一期)</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f4f6f4; margin: 0; padding: 24px; color: #1b3b32; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #5a7268; font-size: 13px; margin-bottom: 20px; }
  .meta a { color: #0e6253; }
  svg { background: #ffffff; border: 1px solid #d7e2dc; border-radius: 10px; display: block; }
  .node rect { rx: 10; fill: #ffffff; stroke: #0e6253; stroke-width: 1.4; }
  .node.manual rect { fill: #eef6f2; }
  .node.fallback rect { stroke: #7f9ec7; stroke-dasharray: 4 3; }
  .node text.name { font-size: 14px; font-weight: bold; fill: #12332b; }
  .node text.detail { font-size: 11px; fill: #5a7268; }
  .edge { fill: none; stroke: #7fa79a; stroke-width: 1.4; marker-end: url(#arrow); }
  .edge.fail { stroke: #c9603c; stroke-dasharray: 5 4; }
  .edgeLabel { font-size: 11px; fill: #47655c; }
  .legend { margin-top: 14px; font-size: 12px; color: #5a7268; }
  h2 { font-size: 16px; margin: 26px 0 8px; }
</style>
</head>
<body>
<h1>美团式匹配评分排行(一期:需求 → 匹配 → 综合分 → 榜单)</h1>
<div class="meta">
  类型:workflow · 版本 1.0 · 2026-10-28 · Brief:<a href="../product/matching_scoring_brief.md">docs/product/matching_scoring_brief.md</a>
  · 旁路:<a href="matching_scoring_workflow.json">matching_scoring_workflow.json</a>(与本图一致)
</div>
<svg width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7fa79a"/>
    </marker>
  </defs>

  <g class="node manual">
    <rect x="30" y="60" width="180" height="70" rx="10"/>
    <text class="name" x="120" y="88" text-anchor="middle">① 采购方输入需求</text>
    <text class="detail" x="120" y="110" text-anchor="middle">自然语言+筛选(区域/资本)</text>
  </g>

  <g class="node">
    <rect x="270" y="60" width="170" height="70" rx="10"/>
    <text class="name" x="355" y="88" text-anchor="middle">② 需求解析</text>
    <text class="detail" x="355" y="110" text-anchor="middle">能力/城市/资本/关键词</text>
  </g>

  <g class="node">
    <rect x="500" y="60" width="170" height="70" rx="10"/>
    <text class="name" x="585" y="88" text-anchor="middle">③ 候选召回</text>
    <text class="detail" x="585" y="110" text-anchor="middle">能力匹配+筛选(supply_match)</text>
  </g>

  <g class="node">
    <rect x="730" y="60" width="200" height="70" rx="10"/>
    <text class="name" x="830" y="88" text-anchor="middle">④ 四维综合评分</text>
    <text class="detail" x="830" y="106" text-anchor="middle">QCDST 40% + 匹配 30% + 工商 15%</text>
    <text class="detail" x="830" y="120" text-anchor="middle">+ 4M1E 15% · 权重可配 · 缺失置 0</text>
  </g>

  <g class="node">
    <rect x="990" y="60" width="160" height="70" rx="10"/>
    <text class="name" x="1070" y="88" text-anchor="middle">⑤ 置信标记</text>
    <text class="detail" x="1070" y="110" text-anchor="middle">证据不足/无数据 显式标注</text>
  </g>

  <g class="node">
    <rect x="860" y="250" width="220" height="70" rx="10"/>
    <text class="name" x="970" y="278" text-anchor="middle">⑥ 排序展示</text>
    <text class="detail" x="970" y="300" text-anchor="middle">综合分+四分项+可解释理由</text>
  </g>

  <g class="node manual">
    <rect x="560" y="250" width="180" height="70" rx="10"/>
    <text class="name" x="650" y="278" text-anchor="middle">⑦ 点开档案</text>
    <text class="detail" x="650" y="300" text-anchor="middle">工商+4M1E+QCDST 联动</text>
  </g>

  <g class="node fallback">
    <rect x="120" y="250" width="280" height="70" rx="10"/>
    <text class="name" x="260" y="278" text-anchor="middle">⑧ 榜单浏览 / 解析失败兜底</text>
    <text class="detail" x="260" y="296" text-anchor="middle">综合总榜 + 32 类品类榜;无需求时</text>
    <text class="detail" x="260" y="310" text-anchor="middle">匹配维度=能力覆盖度;解析失败全库排序</text>
  </g>

  <path class="edge" d="M210,95 L270,95"/>
  <path class="edge" d="M440,95 L500,95"/>
  <path class="edge" d="M670,95 L730,95"/>
  <path class="edge" d="M930,95 L990,95"/>
  <path class="edge" d="M1070,130 L1070,200 L970,200 L970,250"/>
  <path class="edge" d="M860,285 L740,285"/>
  <path class="edge fail" d="M355,130 L355,200 L260,200 L260,250"/>
  <text class="edgeLabel" x="360" y="195">解析失败(兜底)</text>
  <path class="edge" d="M260,250 L260,180 L830,180 L830,130"/>
  <text class="edgeLabel" x="480" y="174">榜单走同一评分管线</text>
</svg>

<h2>子图(二期):需求发布与应答 demand_response_subgraph</h2>
<svg width="1180" height="300" viewBox="0 0 1180 300">
  <g class="node manual">
    <rect x="30" y="60" width="220" height="80" rx="10"/>
    <text class="name" x="140" y="90" text-anchor="middle">D1 采购方发布需求</text>
    <text class="detail" x="140" y="112" text-anchor="middle">品类/规格/量/交期/区域</text>
  </g>
  <g class="node">
    <rect x="330" y="60" width="220" height="80" rx="10"/>
    <text class="name" x="440" y="90" text-anchor="middle">D2 需求入库+匹配推送</text>
    <text class="detail" x="440" y="112" text-anchor="middle">挂 srm store 扩展;按④管线推候选</text>
  </g>
  <g class="node manual">
    <rect x="630" y="60" width="220" height="80" rx="10"/>
    <text class="name" x="740" y="90" text-anchor="middle">D3 供应商查看并应答</text>
    <text class="detail" x="740" y="112" text-anchor="middle">报价/产能/交期承诺(人工)</text>
  </g>
  <g class="node">
    <rect x="930" y="60" width="220" height="80" rx="10"/>
    <text class="name" x="1040" y="90" text-anchor="middle">D4 应答列表(按综合分排序)</text>
    <text class="detail" x="1040" y="112" text-anchor="middle">采购方比对 → 转入 SRM 引入闭环</text>
  </g>
  <path class="edge" d="M250,100 L330,100"/>
  <path class="edge" d="M550,100 L630,100"/>
  <path class="edge" d="M850,100 L930,100"/>
</svg>

<div class="legend">
  实线绿=主路径 · 虚线红=失败兜底 · 虚线蓝框=榜单/兜底节点 ·
  范围外:评分人工干预 / 供应商付费排名 / 自动外采数据 / QCDST 口径变更
</div>
</body>
</html>
