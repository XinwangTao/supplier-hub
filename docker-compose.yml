services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplier_hub
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier
    ports:
      - "5432:5432"
    volumes:
      - supplier-postgres:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: "http://localhost:3000"
      # 真实数据源：把导出的工商信息表挂到 ./backend/data 下，或填入企查查密钥
      SUPPLIER_SOURCE: "${SUPPLIER_SOURCE:-auto}"
      SUPPLIER_CSV: "${SUPPLIER_CSV:-data/suppliers.csv}"
      QCC_KEY: "${QCC_KEY:-}"
      QCC_SECRET_KEY: "${QCC_SECRET_KEY:-}"
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  supplier-postgres:
